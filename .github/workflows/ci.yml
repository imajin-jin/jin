name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job name stays `lint` — it is the required status check on main.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Scaffold sanity check
        run: |
          set -euo pipefail
          test -f README.md
          test -f .env.example
          test -f LICENSE
          test -f docs/DEFINITION-OF-DONE.md
          test -f docs/vision/agentic-dashboard.md

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Proves the app bundles under Metro without a device. Native builds
      # (EAS) are not wired yet — see docs/DEFINITION-OF-DONE.md Phase 1.
      - name: Export (web)
        run: npx expo export --platform web --output-dir /tmp/jin-web-export
